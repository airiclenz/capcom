# capcom ui colour scheme — "dark", the preset for a dark terminal background.
#
# A colour scheme gives a colour to every role capcom ui paints with; the UI never paints the
# terminal's background. This file is compiled into the binary and read once, at start: theme
# dark picks it, and theme auto picks it over a dark background. To change a colour, override
# its role under ui.colors in the user config file rather than editing this file.
#
# Every role has exactly one key here, none missing and none extra. Values are quoted "#rrggbb"
# hex — the quotes matter, because an unquoted # starts a YAML comment.

accent: "#bb9af7"         # the open tab, the dragged divider, the filter and prompt cursor
border: "#565f89"         # the frame, the tree connectors, the scrollbar track, rules in bodies
muted: "#737aa2"          # the key hints, rows shown only to place another, the scrollbar thumb, quotes
link: "#7dcfff"           # links in issue and Note bodies
selection: "#7aa2f7"      # the selected row of a list
heading: "#e0af68"        # headings in issue and Note bodies
code: "#9ece6a"           # inline code and code blocks
status-todo: "#a9b1d6"    # every status of the todo category
status-doing: "#e0af68"   # every status of the doing category
status-waiting: "#ff9e64" # every status of the waiting category
status-done: "#9ece6a"    # every status of the done category
status-dropped: "#565f89" # every status of the dropped category
