name: Fuzz

# Runs every native fuzz target for 30s, one job per target, since Go fuzzes one target per
# invocation. It lives apart from ci.yml so a fuzz failure never blocks a release: the release
# gate reads ci.yml's runs only (Note adr-0008, HasGreenRun in cmd/release).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: internal/frontmatter
            target: FuzzDecode
          - package: internal/rawfm
            target: FuzzConflictMarkers
          - package: internal/issue
            target: FuzzParseIssue
          - package: internal/issue
            target: FuzzMergeFile
          - package: internal/knowledge
            target: FuzzParseNote
          - package: internal/config
            target: FuzzParseConfig
          - package: internal/batch
            target: FuzzParseApply
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Go's fuzzer sometimes ends a clean run with "context deadline exceeded" when -fuzztime
      # runs out, writing no failing input (seen on FuzzDecode and FuzzParseConfig). That run is a
      # pass with a warning; a run that writes a failing input still fails.
      - name: Fuzz
        env:
          TARGET: ${{ matrix.target }}
          PACKAGE: ${{ matrix.package }}
        run: |
          set -o pipefail
          if go test -run='^$' -fuzz="^${TARGET}\$" -fuzztime=30s "./${PACKAGE}" 2>&1 | tee "$RUNNER_TEMP/fuzz.log"; then
            exit 0
          fi
          if grep -q 'Failing input written to' "$RUNNER_TEMP/fuzz.log" \
            || ! tail -n 8 "$RUNNER_TEMP/fuzz.log" | grep -qx '    context deadline exceeded'; then
            exit 1
          fi
          echo "::warning title=${TARGET}::fuzzing ended with context deadline exceeded and wrote no failing input; treated as a pass"
      # A crash leaves its input under the package's testdata/fuzz/<Target>/; commit it with the
      # fix so it runs as a regression case in every plain `go test`.
      - name: Upload the crasher
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crasher-${{ matrix.target }}
          path: ${{ matrix.package }}/testdata/fuzz/
          if-no-files-found: ignore
