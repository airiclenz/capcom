# capcom ui colour scheme — "light", the preset for a light terminal background.
#
# A colour scheme gives a colour to every role capcom ui paints with; the UI never paints the
# terminal's background. This file is compiled into the binary and read once, at start: theme
# light picks it, and theme auto picks it over a light background. To change a colour, override
# its role under ui.colors in the user config file rather than editing this file.
#
# Every role has exactly one key here, none missing and none extra. Values are quoted "#rrggbb"
# hex — the quotes matter, because an unquoted # starts a YAML comment.

accent: "#9854f1"         # the open tab, the dragged divider, the filter and prompt cursor
border: "#a8aecb"         # the frame, the tree connectors, the scrollbar track, rules in bodies
muted: "#6172b0"          # the key hints, rows shown only to place another, the scrollbar thumb, quotes
link: "#007197"           # links in issue and Note bodies
selection: "#2e7de9"      # the selected row of a list
heading: "#8c6c3e"        # headings in issue and Note bodies
code: "#587539"           # inline code and code blocks
status-todo: "#3760bf"    # every status of the todo category
status-doing: "#8c6c3e"   # every status of the doing category
status-waiting: "#b15c00" # every status of the waiting category
status-done: "#587539"    # every status of the done category
status-dropped: "#a8aecb" # every status of the dropped category
