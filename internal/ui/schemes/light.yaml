# capcom ui colour scheme — "light", the preset for a light terminal background.
#
# A colour scheme gives a colour to every role capcom ui paints with; the UI leaves the terminal's
# background alone everywhere but the selected row, which it fills with selection, and the status
# bar's lock badge, which it fills with lock-held or lock-free, and its layout button, which it
# fills with layout-button. This file is
# compiled into the binary and read once, at start: theme light picks it, and theme auto picks it
# over a light background. To change a colour, override its role under ui.colors in the user
# config file rather than editing this file.
#
# The colours are apogee's, taken from apogee's "light" scheme file
# (apogee/internal/scheme/schemes/light.yaml): each line's comment names the apogee role
# its colour comes from.
#
# Every role has exactly one key here, none missing and none extra. Values are quoted "#rrggbb"
# hex — the quotes matter, because an unquoted # starts a YAML comment. The one exception is
# priority-2, the default priority: its value is "", no colour, so P2 shows in the terminal's own
# colour and only the other priorities stand out. The priority colours are capcom's own, not
# apogee's.

accent: "#8250df"         # apogee gauge: the open tab, the dragged divider, the filter and prompt cursor
border: "#d0d7de"         # apogee chrome: the frame, the tree connectors, the scrollbar track, rules in bodies
muted: "#656d76"          # apogee muted: the key hints, rows shown only to place another, the scrollbar thumb, quotes
link: "#6639ba"           # apogee skill: links in issue and Note bodies
selection: "#b3d1ff"      # apogee selection: the selected row of a list
heading: "#1f6feb"        # apogee tool-header: headings in issue and Note bodies
code: "#bc4c00"           # apogee code: inline code and code blocks
status-todo: "#424a53"    # apogee muted-bright: every status of the todo category
status-doing: "#0969da"   # apogee mode-allow-edits: every status of the doing category
status-waiting: "#bc4c00" # apogee mode-auto: every status of the waiting category
status-done: "#115e59"    # apogee success: every status of the done category
status-dropped: "#d0d7de" # apogee chrome: every status of the dropped category
priority-0: "#cf222e"     # red, and bold: P0, the most urgent priority
priority-1: "#9a6700"     # amber: P1
priority-2: ""            # no colour: P2, the default priority, in the terminal's own colour
priority-3: "#656d76"     # the muted colour: P3
priority-4: "#8c959f"     # dimmer than muted: P4, the least urgent priority
lock-held: "#bc4c00"      # apogee mode-auto: the status bar's lock badge while another session holds the Tree lock
lock-free: "#115e59"      # apogee success: the status bar's lock badge while the Tree lock is free
layout-button: "#d0d7de" # apogee chrome: the status bar's layout button
