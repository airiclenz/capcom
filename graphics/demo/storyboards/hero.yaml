# The README's hero clip: a person and a coding agent share one repository. The agent takes the
# Tree lock on an issue, the person looks at what waits on it, the agent finishes it and the
# waiting issue turns Ready, live; then the Closed tab, the Knowledge the agents read, and a
# click on the layout button that stacks the panes and back.
#   photon setup  graphics/demo/storyboards/hero.yaml   # once: build capcom into the work dir
#   until photon record graphics/demo/storyboards/hero.yaml; do :; done
#   photon render graphics/demo/storyboards/hero.yaml   # writes graphics/demo.gif
clip: hero
ship: ../../demo.gif
frame: {cols: 120, rows: 32, padding: 16, font_size: 14, line_height: 1.2, scale: 2, width: 960, fps: 24, max_colors: 128}
expect:
  - seen: '~/tern · v\d+\.\d+\.\d+ · capcom'
    area: tabs
beats:
  - id: 1
    title: the ready queue
    why: capcom ui opens on what is ready to work on, most urgent first, with each tab's count
    duration: 1500ms
    do:
      - wait: {screen: 'rate-limit +open +P1 +feature', timeout: 10s}
      - pause: {for: 600ms}
    expect:
      - seen: 'Ready \[13\]'
        area: tabs
      - seen: 'lock +free'
        area: status
  - id: 2
    title: an agent takes rate-limit
    why: an agent claims an issue and the Tree lock from the CLI; the badge names it and the issue leaves the queue
    duration: 4500ms
    hold: 2s
    do:
      - key: {name: down}
      - wait: {screen: 'starts in a goroutine', timeout: 5s}
      - wait: {screen: 'held by claude: rate-limit', timeout: 10s}
      - wait: {screen: 'rate-limit +open', gone: true, timeout: 5s}
      - pause: {for: 1200ms}
    expect:
      - seen: 'held by claude: rate-limit'
        area: status
      - seen: 'Ready \[12\]'
        area: tabs
  - id: 3
    title: what waits on it
    why: the dependency view shows that abuse-reports waits on the issue the agent holds
    duration: 3500ms
    do:
      - click: {target: {text: 'Issues', area: tabs}}
      - wait: {screen: 'v1-launch +open +P1', timeout: 5s}
      - pause: {for: 360ms}
      - click: {target: {text: 'v1-launch +open +P1', area: panes}}
      - wait: {screen: 'Ship tern v1\n', timeout: 5s}
      - pause: {for: 240ms}
      - key: {name: right}
      - wait: {screen: 'abuse-reports +open', timeout: 5s}
      - pause: {for: 240ms}
      - click: {target: {text: 'abuse-reports +open +P2', area: panes}}
      - wait: {screen: 'Report abusive links\n', timeout: 5s}
      - pause: {for: 360ms}
      - type: {text: 'd', humanize: false}
      - wait: {screen: 'waits on:', timeout: 5s}
      - pause: {for: 600ms}
    expect:
      - seen: 'rate-limit +active +P1'
  - id: 4
    title: the agent finishes
    why: the agent's finish lands in the files; the dependency view and the lock badge redraw without being asked
    duration: 5s
    hold: 2s
    do:
      - wait: {screen: 'rate-limit +done', timeout: 10s}
      - wait: {screen: 'lock +free', timeout: 5s}
      - pause: {for: 1500ms}
    expect:
      - seen: 'lock +free'
        area: status
      - run: 'cd home/tern && ../../capcom show rate-limit | grep -q "^status: done$"'
  - id: 5
    title: abuse-reports is ready
    why: closing what it waited on puts abuse-reports in the Ready queue
    duration: 2500ms
    do:
      - key: {name: esc}
      - type: {text: '2', humanize: false}
      - wait: {screen: '(?m)^ *abuse-reports +open +P2', timeout: 5s}
      - pause: {for: 1200ms}
    expect:
      - seen: '(?m)^ *abuse-reports +open +P2'
  - id: 6
    title: the closed tab
    why: the Closed tab lists what was finished, newest first, with the reason the agent gave
    duration: 3500ms
    do:
      - type: {text: '4', humanize: false}
      - wait: {screen: 'rate-limit +feature', timeout: 5s}
      - pause: {for: 360ms}
      # The tab kept the row it selected before rate-limit closed: click the newest one.
      - click: {target: {text: 'rate-limit +feature', area: panes}}
      - wait: {screen: 'limiter merged, tests green', timeout: 5s}
      - pause: {for: 1500ms}
    expect:
      - seen: 'Closed \[3\]'
        area: tabs
  - id: 7
    title: the knowledge
    why: the Knowledge tab holds the Notes agents read before they work
    duration: 3500ms
    hold: 1200ms
    do:
      - click: {target: {text: 'Knowledge', area: tabs}}
      - wait: {screen: 'architecture', timeout: 5s}
      - pause: {for: 480ms}
      - key: {name: right}
      - wait: {screen: 'redirect-path', timeout: 5s}
      - pause: {for: 360ms}
      - key: {name: down}
      - wait: {screen: 'one indexed lookup', timeout: 5s}
      - pause: {for: 1440ms}
    expect:
      - seen: 'Redirects skip the admin API'
  - id: 8
    title: split or stacked
    why: the layout button at the status bar's right edge stacks the panes, the sidebar above the detail pane, and v switches back
    duration: 4500ms
    hold: 1500ms
    do:
      - pause: {for: 300ms}
      - click: {target: {text: '───$', area: status}}
      - wait: {screen: 'q quit +│ ?$', timeout: 5s}
      - pause: {for: 1800ms}
      - type: {text: 'v', humanize: false}
      - wait: {screen: 'q quit +───$', timeout: 5s}
      - pause: {for: 900ms}
    expect:
      - seen: 'q quit +───$'
        area: status
      - run: 'grep -rqsE "layout: \"?split" config home'

camera:
  positions:
    # Beat 2: the lock badge on the status bar, the bottom row.
    - {cell: {x: 24, y: 31}, at: {beat: 2}, hold: 4200ms}
    # Beat 4: the dependency view in the detail pane.
    # Aimed at the corner, so the crop stays pinned to the top and right edges through the whole
    # zoom; aimed at the text, it let go of the right edge partway in, and the zoom jerked.
    - {cell: {x: 119, y: 0}, at: {beat: 4}, hold: 4500ms}
  zooms:
    # Beat 2: push into the badge as the agent takes the lock, then back out.
    - {to: 1.8, at: {beat: 2, offset: 300ms}, over: 1400ms}
    - {to: 1, at: {beat: 2, offset: 3100ms}, over: 1200ms}
    # Beat 4: push into what abuse-reports waits on as the agent's finish lands, then back out.
    - {to: 1.6, at: {beat: 4}, over: 1400ms}
    - {to: 1, at: {beat: 4, offset: 3500ms}, over: 1400ms}
