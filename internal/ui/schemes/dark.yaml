# capcom ui colour scheme — "dark", the preset for a dark terminal background.
#
# A colour scheme gives a colour to every role capcom ui paints with; the UI leaves the terminal's
# background alone everywhere but the selected row, which it fills with selection, and the status
# bar's lock badge, which it fills with lock-held or lock-free, and its layout button, which it
# fills with layout-button. This file is
# compiled into the binary and read once, at start: theme dark picks it, and theme auto picks it
# over a dark background. To change a colour, override its role under ui.colors in the user config
# file rather than editing this file.
#
# The colours are apogee's, taken from apogee's "dark" scheme file
# (apogee/internal/scheme/schemes/dark.yaml): each line's comment names the apogee role
# its colour comes from.
#
# Every role has exactly one key here, none missing and none extra. Values are quoted "#rrggbb"
# hex — the quotes matter, because an unquoted # starts a YAML comment.

accent: "#c396ff"         # apogee gauge: the open tab, the dragged divider, the filter and prompt cursor
border: "#4a4a4a"         # apogee chrome: the frame, the tree connectors, the scrollbar track, rules in bodies
muted: "#8a8a8a"          # apogee muted: the key hints, rows shown only to place another, the scrollbar thumb, quotes
link: "#40b0ff"           # apogee skill: links in issue and Note bodies
selection: "#3a5fcd"      # apogee selection: the selected row of a list
heading: "#aea580"        # apogee tool-header: headings in issue and Note bodies
code: "#70BBFF"           # apogee code: inline code and code blocks
status-todo: "#b2b2b2"    # apogee muted-bright: every status of the todo category
status-doing: "#58a6ff"   # apogee mode-allow-edits: every status of the doing category
status-waiting: "#f0883e" # apogee mode-auto: every status of the waiting category
status-done: "#43d389"    # apogee success: every status of the done category
status-dropped: "#4a4a4a" # apogee chrome: every status of the dropped category
lock-held: "#f0883e"      # apogee mode-auto: the status bar's lock badge while another session holds the Tree lock
lock-free: "#43d389"      # apogee success: the status bar's lock badge while the Tree lock is free
layout-button: "#4a4a4a" # apogee chrome: the status bar's layout button
